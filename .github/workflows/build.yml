name: "Build (Linux)"

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: /github/home/.ccache
  DEBIAN_FRONTEND: noninteractive

jobs:
  linux:
    name: Linux (Ubuntu 26.04, amd64)
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 480

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf glslang-tools cmake git gcc g++ ninja-build ccache \
            qt6-tools-dev libtool nasm pkg-config nlohmann-json3-dev spirv-headers \
            libglu1-mesa-dev libhidapi-dev libpulse-dev libudev-dev \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 libxext-dev libxkbcommon-x11-0 mesa-common-dev \
            qt6-base-private-dev libenet-dev libsimpleini-dev libcpp-jwt-dev libfmt-dev \
            liblz4-dev libzstd-dev libssl-dev libavfilter-dev libavcodec-dev \
            libswscale-dev zlib1g-dev libva-dev libvdpau-dev \
            libcubeb-dev libvulkan-dev spirv-tools libusb-1.0-0-dev \
            libqt6core5compat6 libquazip1-qt6-dev libopus-dev qt6-charts-dev \
            libfrozen-dev libvulkan-memory-allocator-dev libsdl3-dev \
            libasound2-dev libboost-context-dev libboost-fiber-dev libcpp-httplib-dev \
            vulkan-utility-libraries-dev

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-linux-${{ hashFiles('cpmfile.json', 'CMakeModules/CPM.cmake') }}
          restore-keys: cpm-linux-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /github/home/.ccache
          key: ccache-linux-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ github.ref_name }}-
            ccache-linux-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DENABLE_QT_TRANSLATION=ON \
            -DENABLE_UPDATE_CHECKER=OFF \
            -DUSE_DISCORD_PRESENCE=ON \
            -DENABLE_LTO=ON \
            -DUSE_CCACHE=ON \
            -DYUZU_USE_BUNDLED_SIRIT=ON \
            -DYUZU_USE_BUNDLED_FFMPEG=ON \
            -DYUZU_DISABLE_LLVM=ON \
            -DYUZU_CMD=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_ID=linux

      - name: Build
        run: cmake --build build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eden-linux-amd64-${{ github.sha }}
          if-no-files-found: error
          path: build/bin
