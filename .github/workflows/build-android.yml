name: "Build (Android)"

on:
  push:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Build flavor"
        type: choice
        options: [standard, legacy, optimized, chromeos]
        default: standard
      build-type:
        description: "Build type"
        type: choice
        options: [Release, RelWithDebInfo, Debug]
        default: Release

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 480

    env:
      FLAVOR: ${{ inputs.flavor || 'standard' }}
      BUILD_TYPE: ${{ inputs.build-type || 'Release' }}
      # The build script passes USE_CCACHE to CMake, which hard-fails if ccache is missing
      CCACHE: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.5"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y apksigner glslang-tools libvulkan-dev python3-requests

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/android/**/*.gradle.kts', 'src/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore CPM cache
        uses: actions/cache@v4
        with:
          path: .cache/cpm
          key: cpm-android-${{ hashFiles('cpmfile.json', 'CMakeModules/CPM.cmake') }}
          restore-keys: cpm-android-

      - name: Build
        run: ./.ci/android/build.sh -t "$FLAVOR" -b "$BUILD_TYPE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eden-android-${{ env.FLAVOR }}-${{ github.sha }}
          if-no-files-found: error
          path: artifacts/*.apk
